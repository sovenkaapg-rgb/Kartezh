<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Картеж - Mini App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
</head>
<body>

    <div class="game-container">
        
        <!-- ТОП БАР (Баланс, Лояльность, Таймер) -->
        <div class="top-bar">
            <div class="top-left-group">
                <!-- Баланс монет -->
                <div class="coin-balance">
                    <img src="assets/coins_pile.png" alt="Монеты" class="icon-coins">
                    <span id="balance-value">0</span> 🪙
                </div>
                
                <!-- Шкала лояльности (отношения) -->
                <div class="affinity-block">
                    <div class="affinity-header">
                        <span>Отношение борга</span>
                    </div>
                    <div class="affinity-bar-bg">
                        <div class="affinity-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Блок таймера кулдауна -->
            <div class="timer-block">
                <img src="assets/hourglass.png" alt="Таймер" class="icon-hourglass">
                <div class="timer-info">
                    <span id="time-left">00ч 00м 00с</span>
                    <button class="btn-buy-hour">Купить час (-20 🪙)</button>
                </div>
            </div>
        </div>

        <!-- ДИАЛОГ С БОТОМ -->
        <div class="bot-speech-bubble">
            Приветствую, путник... Испытаешь удачу? Нажми на круг, чтобы призвать карты...
        </div>
        <!-- ИГРОВОЕ ПОЛЕ -->
        <div class="game-field">
            
            <!-- Аватар персонажа (наплывает на круг из-за отрицательного margin в CSS) -->
            <img src="assets/бот.png" alt="Бот" class="bot-character">

            <!-- Контейнер интерактивного вызова карт -->
            <div class="magic-ring-container">
                <!-- Магический круг (задний фон и триггер клика для вызова) -->
                <img src="assets/magic_circle.png" alt="Магический круг" class="magic-ring-bg">
                
                <!-- Сюда JS генерирует 3 карты. Изначально внутри плейсхолдер -->
                <div class="cards-drop-zone">
                    <div class="zone-placeholder">Нажми на круг, чтобы призвать карты...</div>
                </div>
            </div>

            <!-- Встроенная зона ответов лояльности (управляется вашим CSS для квизов) -->
            <div class="quiz-options-inline">
                <button class="btn-quiz-inline" id="quiz-ans-a">Вариант А</button>
                <button class="btn-quiz-inline" id="quiz-ans-b">Вариант Б</button>
                <button class="btn-quiz-skip">✕</button>
            </div>
        </div>
        <!-- ЭКРАН КОЛОДЫ (ОТКРЫВАЕТСЯ НА ВЕСЬ ЭКРАН) -->
        <div class="deck-screen">
            <div class="deck-header">
                <div class="deck-title-block">
                    <img src="assets/стопка.png" alt="Колода" class="icon-deck-small">
                    <h2>Твоя Колода</h2>
                </div>
                <!-- Кнопка закрытия экрана коллекции -->
                <button class="btn-close-deck">✕</button>
            </div>

            <!-- Сетка для карт. JS заполнит её ВСЕМИ картами игры. 
                 Заблокированные получат класс .card-locked -->
            <div class="deck-grid">
                <!-- Карточки генерируются динамически через JS -->
            </div>
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ ПРИЛОЖЕНИЯ -->
        <div class="bottom-bar">
            <!-- Кнопка для открытия экрана коллекции -->
            <div class="deck-button">
                <img src="assets/стопка.png" alt="Колода" class="icon-deck">
                <span>Моя Колода</span>
            </div>

            <!-- Имя игрока из Telegram Telegram WebApp SDK -->
            <div class="player-username">@Путник</div>

            <!-- Вотермарк / Ссылка на канал проекта -->
            <a href="https://t.me/SovenkaArt" class="tg-watermark" target="_blank">SovenkArt</a>
        </div>

    </div> <!-- Конец .game-container -->

    <!-- Подключаем фронтенд логику (скрипт из предыдущего шага) -->
    <script src="app.js"></script>
</body>
</html>
