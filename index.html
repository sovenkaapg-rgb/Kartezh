<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Картеж - Mini App</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <script src="https://unpkg.com"></script>
     <script src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        
        <!-- ТОП БАР (Профиль загружается сразу) -->
        <div class="top-bar">
            <div class="top-left-group">
                <div class="coin-balance">
                    <img src="assets/coins_pile.png" class="icon-coins" alt="Монеты">
                    <!-- ID для динамического баланса -->
                    <span id="player-coins">0</span> 🪙
                </div>
                <div class="player-username" id="player-name">Загрузка...</div>
            </div>
            
            <div class="timer-block">
                <img src="assets/hourglass.png" class="icon-hourglass" id="hourglass-img" alt="Таймер">
                <div class="timer-info">
                    <!-- ID для вывода времени КД -->
                    <div id="time-left">00ч 00м 00с</div>
                    <button class="btn-buy-hour" id="btn-buy-hour">Купить час (-20 🪙)</button>
                </div>
            </div>
        </div>

        <!-- ИГРОВОЕ ПОЛЕ -->
        <div class="game-field">
            <!-- Текст бота -->
            <div class="bot-speech-bubble" id="bot-bubble">
                Приветствую, путник... Испытаешь удачу?
            </div>

            <!-- Зона генерации трех карт -->
            <div class="magic-ring-container" id="main-trigger">
                <img src="assets/magic_circle.png" class="magic-ring-bg" alt="Магический круг">
                <div class="cards-drop-zone" id="cards-zone">
                    <!-- Сюда JS будет выкладывать 3 карты -->
                    <div class="zone-placeholder">Нажми на круг, чтобы призвать карты...</div>
                </div>
            </div>

            <!-- Аватар бота -->
            <img src="assets/бот.png" class="bot-character" alt="Бот">
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-bar">
            <div class="deck-button" id="open-deck-btn">
                <img src="assets/стопка.png" class="icon-deck" alt="Колода">
                <span>Колода</span>
            </div>

            <!-- Шкала лояльности -->
            <div class="affinity-block">
                <div class="affinity-header">
                    <span>Лояльность</span>
                    <span id="affinity-pct">0%</span>
                </div>
                <div class="affinity-bar-bg">
                    <div class="affinity-bar-fill" id="affinity-fill" style="width: 0%;"></div>
                </div>
                <div class="affinity-header" style="justify-content: center; margin-top: 2px;">
                    <span id="affinity-label">едва замечаю</span>
                </div>
            </div>
        </div>

        <!-- ЭКРАН КОЛОДЫ (Изначально скрыт) -->
        <div class="deck-screen" id="deck-screen">
            <div class="deck-header">
                <div class="deck-title-block">
                    <img src="assets/стопка.png" class="icon-deck-small" alt="Колода">
                    <h2 id="deck-title-count">Твоя Колода (0/0)</h2>
                </div>
                <button class="btn-close-deck" id="close-deck-btn">✕</button>
            </div>
            <!-- Сетка для ВСЕХ карт из базы данных -->
            <div class="deck-grid" id="deck-grid"></div>
        </div>

    </div>

    <!-- Подключаем фронтенд логику -->
   
</body>
</html>
