<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>картеж</title>
     <script src="https://telegram.org"></script>
    <!-- ПОДКЛЮЧАЕМ ВСЕ МОДУЛИ СТИЛЕЙ НАПРЯМУЮ ЧЕРЕЗ HTML -->
    <link rel="stylesheet" href="styles/card-presets.css">
    <link rel="stylesheet" href="styles/interface.css">
    <link rel="stylesheet" href="styles/scene.css">
    <link rel="stylesheet" href="styles/deck.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/style.css"> <!-- Главный styles всегда идет последним! -->
</head>

<body>
    <div class="main-app-screen">
    <!-- ВСТАВЬТЕ ЭТУ СТРОКУ СЮДА: Специальный оверлей для затемнения всей сцены -->
    <div class="scene-dark-overlay"></div>
    
    <!-- ВЕРХНИЙ ХУД -->
<div class="top-hud-panel">
    <!-- ЛЕВАЯ СТОРОНА: Монеты и Лояльность -->
<!-- Внутри top-hud-panel в index.html -->
<div class="hud-left-side">
    <div class="coin-balance">
        <span class="coin-amount">125</span> 
        <!-- Заменили смайлик на твою иконку -->
        <img class="icon-coin" src="assets/coins_pile.png" alt="coins">
    </div>
    <div class="affinity-bar-container">
        <!-- Оставляем только текст заголовка лояльности, саму шкалу убираем из HTML — её JS соберет один раз -->
        <div class="affinity-header">едва замечаю (15)</div>
    </div>
</div>

    <!-- ЦЕНТР: Крутящиеся песочные часы -->
    <div class="hud-center-side">
        <div class="spinning-hourglass-wrapper">
            <img class="icon-hourglass spinning-hourglass" src="assets/hourglass.png" alt="⏳">
        </div>
    </div>

    <!-- ПРАВАЯ СТОРОНА: Таймер кулдауна и кнопка покупки под ним -->
    <div class="hud-right-side">
        <div class="cooldown-box">00ч 04м 30с</div>
        <div class="buy-hour-wrapper">
            <button class="btn-buy-hour">Купить -1 час</button>
        </div>
    </div>
</div>

    <!-- ТЕКСТОВАЯ ПОДСКАЗКА БОТА С ТЕМНОЙ ПОДЛОЖКОЙ -->
    <div class="bot-speech-bubble">Хм-м... Давай посмотрим, что тебе уготовила судьба!</div>
    <div class="game-field">
        <div class="parallax-bg-layer" style="background-image: url('assets/bg.png');"></div>
        
        <div class="bot-character-container">
            <img class="bot-part-body" src="assets/sf_body.png" alt="Бот">
            <img class="bot-part-hand" src="assets/sf_hend.png" alt="Рука бота">
        </div>

        <div class="front-table-layer">
            <img class="table-img" src="assets/table.png" alt="Стол">
            <div class="magic-ring-container">
                <div class="cards-drop-zone">
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНИЙ ХУД (ПОДВАЛ) -->
    <div class="bottom-hud-panel">
        <!-- Левый угол: Кнопка колоды -->
        <button class="deck-button">Моя Колода</button>

        <!-- Центр: Никнейм -->
        <div class="fixed-player-username">@Загрузка...</div>

        <!-- Правый угол: Ссылка автора -->
        <a href="https://boosty.to/sovenkaart/donate" target="_blank" class="author-link">Пддержать проект</a>
    </div>

    <!-- АВАРТИЙНАЯ ФОРМА ВХОДА -->
    <div id="auth-overlay" class="auth-overlay-box">
        <div class="auth-modal">
            <h3>Карты</h3>
            <p>Не удалось подключиться к Telegram сессии.</p>
            <label for="manual-username">Введите ваш Telegram никнейм вручную:</label>
            <input type="text" id="manual-username" placeholder="username">
            <button id="btn-manual-login">Войти</button>
        </div>
    </div>
</div>
<!-- Экран просмотра всей коллекции (Колоды) -->
<div class="deck-screen">
    <h2>Моя Колода</h2>
    
    <!-- Сетка, в которую deck.js будет рендерить карточки -->
    <div class="deck-grid"></div>
    
    <button class="btn-close-deck">Закрыть</button>
</div>

<!-- Модальное окно для детального просмотра/сжигания карты -->
<div id="card-modal" class="card-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; flex-direction: column; opacity: 0; transition: opacity 0.2s; z-index: 99999;">
    <div class="modal-card-placeholder" style="width: 240px; height: 340px; margin-bottom: 20px;"></div>
    <div class="modal-actions" style="display: flex; gap: 12px;">
        <button class="btn-keep" style="padding: 12px 24px; border-radius: 8px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer;">Оставить</button>
        <button class="btn-burn" style="padding: 12px 24px; border-radius: 8px; border: none; background: #b91c1c; color: #fff; font-weight: bold; cursor: pointer;">🔥 Сжечь</button>
    </div>
</div>



 
    <script type="module" src="js/main.js"></script>

    <!-- НИКНЕЙМ ИГРОКА: Вынесен под скрипт, чтобы железно висеть поверх любой графики по центру -->
    <div class="fixed-player-username">@Загрузка...</div>

</body>
</html>
