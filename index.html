<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Картеж - Mini App</title>

<!-- Было: <script src="https://telegram.org..."></script> -->
<!-- Стало: -->
    <script src="js/telegram.org"></script>

    <!-- 2. Ваши стили -->
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <div class="main-app-screen">
    <!-- ВЕРХНИЙ ХУД -->
    <div class="top-hud-panel">
        <!-- Левая часть: кулдаун и песочные часы -->
        <div class="cooldown-box">
            <img src="assets/hourglass.png" alt="timer" class="icon-hourglass" id="icon-hourglass">
            <span id="time-left">00ч 00м 00с</span>
            <button class="btn-buy-hour">Купить час (-20 🪙)</button>
        </div>

        <!-- Правая часть: лояльность и монеты -->
        <div class="right-stats-group">
            <div class="affinity-bar-container">
                <div class="affinity-header">
                    <span>едва замечаю (15)</span>
                </div>
                <div class="affinity-bar-bg">
                    <div class="affinity-bar-fill" style="width: 15%;"></div>
                </div>
            </div>
            <div class="coin-balance">
                <img src="assets/coins_pile.png" alt="coins" class="icon-coin">
                <span>0</span>
            </div>
        </div>
    </div>

    <!-- ТЕКСТОВАЯ ПОДСКАЗКА БОТА С ТЕМНОЙ ПОДЛОЖКОЙ -->
    <div class="bot-speech-bubble">Хм-м... Давай посмотрим, что тебе уготовила судьба!</div>

    <!-- ИГРОВОЕ ПОЛЕ (Параллакс, Бот, Стол) -->
    <div class="game-field">
        <div class="parallax-bg-layer" style="background-image: url('assets/bg.png');"></div>
        
        <div class="bot-character-container">
            <img class="bot-part-body" src="assets/sf_body.png" alt="Бот">
            <img class="bot-part-hand" src="assets/sf_hend.png" alt="Рука бота">
        </div>

        <div class="front-table-layer">
            <img class="table-img" src="assets/table.png" alt="Стол">
            <div class="magic-ring-container">
                <div class="cards-drop-zone">
                    <div class="zone-placeholder">Тут будут карты когда придет время</div>
                </div>
            </div>
        </div>
    </div>

    <!-- НИЖНИЙ ХУД (ПОДВАЛ) -->
    <div class="bottom-hud-panel">
        <!-- Левый угол: Кнопка колоды -->
        <button class="deck-button">Моя Колода</button>

        <!-- Центр: Никнейм -->
        <div class="fixed-player-username">@Загрузка...</div>

        <!-- Правый угол: Ссылка автора -->
        <a href="https://t.me" target="_blank" class="author-link">SovenkArt</a>
    </div>

    <!-- АВАРТИЙНАЯ ФОРМА ВХОДА -->
    <div id="auth-overlay" class="auth-overlay-box">
        <div class="auth-modal">
            <h3>Вход в Картеж</h3>
            <p>Не удалось подключиться к Telegram сессии.</p>
            <label for="manual-username">Введите ваш Telegram никнейм вручную:</label>
            <input type="text" id="manual-username" placeholder="username">
            <button id="btn-manual-login">Войти в колоду</button>
        </div>
    </div>
</div>



 
    <script type="module" src="js/main.js"></script>

    <!-- НИКНЕЙМ ИГРОКА: Вынесен под скрипт, чтобы железно висеть поверх любой графики по центру -->
    <div class="fixed-player-username">@Загрузка...</div>

</body>
</html>
